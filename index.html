<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mojo's Ordering</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("mojos_theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Branch select -->
<section id="branchScreen" class="screen">
  <div class="branch-screen">
    <button class="icon-btn theme-toggle" id="themeToggle" title="Switch theme" aria-label="Switch theme"></button>
    <div class="logo">Mojo's Ordering</div>
    <div class="tagline">Select your branch to start an order</div>
    <div class="branch-grid" id="branchGrid"></div>
  </div>
</section>

<!-- Supplier select -->
<section id="supplierScreen" class="screen">
  <div class="branch-screen">
    <button class="back-link" id="backToBranch">&#8592; Change branch</button>
    <div class="logo">Mojo's Ordering</div>
    <div class="tagline" id="supplierBranchTag"></div>
    <div class="branch-grid" id="supplierGrid"></div>
  </div>
</section>

<!-- Order form -->
<section id="orderScreen" class="screen">
  <header class="topbar">
    <div>
      <span id="supplierTitle">Order Sheet</span>
      <span class="branch-tag" id="branchTag"></span>
    </div>
    <button class="icon-btn danger" id="clearAllBtn" title="Clear all" aria-label="Clear all">&#128465;</button>
    <button class="icon-btn" id="switchBranch" title="Change supplier" aria-label="Change supplier">&#8646;</button>
    <button class="icon-btn" id="startOverBtn" title="Start over" aria-label="Start over from branch selection">&#8962;</button>
  </header>
  <div class="action-toast hidden" id="actionToast"></div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search items...">
    <label class="filter-toggle">
      <input type="checkbox" id="onlyTouchedToggle">
      Show only items with a quantity
    </label>
  </div>
  <div class="content" id="orderContent"></div>
  <div class="incomplete-warning hidden" id="incompleteWarning">
    &#9888; <span id="incompleteText"></span>
  </div>
  <div class="bottombar">
    <div class="count"><strong id="selectedCount">0</strong> items selected<span class="total" id="estTotal">฿0</span></div>
    <button class="btn" id="reviewBtn" disabled>Review Order</button>
  </div>
</section>

<!-- Review -->
<section id="reviewScreen" class="screen">
  <header class="topbar">
    <div>Review Order</div>
    <button class="icon-btn" id="startOverReviewBtn" title="Start over" aria-label="Start over from branch selection">&#8962;</button>
  </header>
  <div class="review-list" id="reviewList"></div>
  <div class="bottombar stacked">
    <button class="btn secondary block" id="backToOrder">Edit</button>
    <div class="action-row">
      <button class="btn" id="emailOrderBtn">&#9993; Email Order</button>
      <button class="btn" id="copyReviewBtn">&#128203; Copy Order</button>
    </div>
    <button class="btn secondary block" id="excelReviewBtn">&#128202; Send as Excel</button>
  </div>
</section>

<!-- Confirmation -->
<section id="confirmScreen" class="screen">
  <div class="confirm-screen">
    <div class="confirm-icon">&#10003;</div>
    <h2 id="confirmHeading">Order sent</h2>
    <p id="confirmBody">Your mail app has opened with the order pre-filled. Tap send there to confirm.</p>
    <button class="btn" id="nextSupplierBtn">Order From Another Supplier</button>
    <button class="btn secondary" id="newOrderBtn">Start New Order</button>
    <button class="btn secondary" id="emailConfirmBtn">&#9993; Email Order</button>
    <button class="btn secondary copy-btn" id="copyOrderBtn">&#128203; Copy Order Text</button>
    <button class="btn secondary" id="excelConfirmBtn">&#128202; Send as Excel</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
